global
    log stdout format raw local0

defaults
    mode http
    option httplog
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend ohd_frontend
    bind :8080
    capture request header traceparent len 64
    capture request header tracestate len 256
    capture request header OHD-Trace-ID len 64
    default_backend nginx_backend

backend nginx_backend
    server nginx 127.0.0.1:8081
