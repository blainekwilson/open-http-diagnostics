# Prototype OpenResty configuration.
# Dependencies: lua-resty-random and lua-resty-string.

lua_package_path '/usr/local/openresty/lualib/?.lua;;';

# Variables used by access logs.
set $ohd_trace_id '-';
set $ohd_trace_source '-';
set $ohd_trace_id_mismatch 'false';

log_format ohd_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"method":"$request_method",'
      '"host":"$host",'
      '"path":"$uri",'
      '"status":$status,'
      '"duration":$request_time,'
      '"traceparent":"$http_traceparent",'
      '"tracestate":"$http_tracestate",'
      '"ohd_trace_id":"$ohd_trace_id",'
      '"trace_source":"$ohd_trace_source",'
      '"ohd_trace_id_mismatch":$ohd_trace_id_mismatch'
    '}';

